services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: bookrag
      POSTGRES_USER: bookrag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookrag -d bookrag"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    env_file:
      - ./server/.env
    environment:
      PORT: 4000
      DATABASE_URL: postgres://bookrag:${POSTGRES_PASSWORD:-postgres}@postgres:5432/bookrag
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      GROQ_REWRITE_MODEL: ${GROQ_REWRITE_MODEL:-openai/gpt-oss-20b}
      UPLOAD_DIR: /data/books
      CLIENT_ORIGIN: http://localhost:5173
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-Xenova/bge-small-en-v1.5}
      EMBEDDING_DTYPE: ${EMBEDDING_DTYPE:-q8}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-8}
    ports:
      - "4000:4000"
    volumes:
      - ./data/books:/data/books
    depends_on:
      postgres:
        condition: service_healthy

  client:
    build:
      context: ./client
      args:
        VITE_API_BASE_URL: http://localhost:4000/api
    ports:
      - "5173:5173"
    depends_on:
      - server

volumes:
  postgres_data:
